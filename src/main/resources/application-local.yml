spring:
  config:
    activate:
      on-profile: local

server:
  port: 8080

jobs:
  apply-scheduled-plan:
    cron: "0 */1 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

clients:
  customer:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    connect-timeout: 3s
    response-timeout: 2s